# 推到 main 就建置並部署到 GitHub Pages（給組員看的即時版）。
# 網址：https://ruyuang0509.github.io/fuen58-fashion-frontend/
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # GITHUB_PAGES=1 讓 vite 的 base 變成 /fuen58-fashion-frontend/；postbuild 會多出 404.html 當 SPA 後備
      - run: npm run build
        env:
          GITHUB_PAGES: '1'
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
